# Déploiement Render (offre gratuite) — https://render.com
# 1. Pousser ce projet sur un dépôt GitHub (privé).
# 2. Sur Render : New + → Blueprint → sélectionner ce dépôt (Render lit ce fichier).
# 3. Renseigner les variables d'environnement marquées « sync: false » (valeurs secrètes)
#    dans le tableau de bord Render (jamais dans le code).
#
# ⚠️ Offre gratuite : le service se met en veille après ~15 min d'inactivité et met ~30 s à se
#    réveiller à la 1re requête. Parfait pour tester ; passer à une offre payante (~7 $/mois) ou un
#    petit VPS pour supprimer ce délai.

services:
  - type: web
    name: rh-pef
    runtime: node
    region: frankfurt
    plan: free
    # Branche déployée : on travaille sur feat/stock-achats, Render la déploie automatiquement
    # (plus besoin de faire avancer main à la main à chaque lot).
    branch: feat/stock-achats
    # --include=dev : NODE_ENV=production ci-dessous ferait sinon sauter les devDependencies
    # (tailwindcss, @tailwindcss/postcss, typescript…) qui sont nécessaires au build Next.
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /login
    # DÉPLOIEMENT À LA DEMANDE (décision du 2026-08-03) — surtout PAS `autoDeploy: true`.
    #
    # Chaque build reconstruit tout (npm ci + prisma generate + migrate deploy + durcissement +
    # next build) : 5 à 8 minutes de pipeline. En juillet 2026, les trois applications réellement
    # déployées depuis GitHub ont reçu 696 commits sur leur branche déployée (RH PEF 375, Atelier
    # 180, Bolimo 141) — donc autant de builds, de l'ordre de 3 500 à 5 500 minutes. Le quota
    # mensuel a sauté et Render a cessé de déployer.
    #
    # Le travail n'était pas en cause, le RYTHME l'était : sur une session, quinze pushes
    # déclenchaient quinze builds là où le dernier seul comptait. On pousse donc autant qu'on veut,
    # et la production ne se reconstruit que sur demande explicite :
    #
    #     npm run deployer
    #
    # (appelle le Deploy Hook Render — voir scripts/deployer.mjs).
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      # --- Secrets à renseigner dans le tableau de bord Render ---
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # --- E-mail (Google Workspace) ---
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: sachatshiongo@patesenfolie.cd
      - key: SMTP_PASS
        sync: false # mot de passe d'application Google (16 lettres)
      - key: SMTP_FROM
        value: RH Pâtes en Folie <sachatshiongo@patesenfolie.cd>
      # --- Rappels quotidiens (planning GitHub Actions -> /api/cron/alertes) ---
      # Jeton partagé : même valeur ici (dashboard Render) et en secret GitHub Actions « CRON_SECRET ».
      - key: CRON_SECRET
        sync: false
      # --- Web Push (notifications navigateur/PWA) ---
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        value: BG9tzVF6q5pBges9bsHynpzI1tD9cww3K_f3MSG6Pmu0G1Lmj_OBiw5OBEPZE_1CIigPCWoyM-ZaVd_5WcxjYv4
      - key: VAPID_SUBJECT
        value: mailto:sachatshiongo@patesenfolie.cd
      - key: VAPID_PRIVATE_KEY
        sync: false # clé privée VAPID (secrète)
