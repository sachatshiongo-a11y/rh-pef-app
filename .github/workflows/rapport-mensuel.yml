name: Rapport mensuel automatique

# Envoie le 1er de chaque mois la synthèse du mois écoulé (paie + achats) par e-mail
# aux comptes Direction, en appelant l'endpoint sécurisé de l'application.
on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC le 1er du mois = 07:00 à Kinshasa (UTC+1)
  workflow_dispatch: {} # bouton « Run workflow » pour tester manuellement

jobs:
  rapport:
    runs-on: ubuntu-latest
    steps:
      # Réveil d'abord (2026-10-14) : l'instance Render gratuite s'endort après 15 min ; son démarrage à froid
      # mangeait le délai de l'envoi (curl : code 28). On attend qu'elle réponde, sans rien déclencher.
      - name: Réveiller l'application
        run: |
          curl -fsS --max-time 60 --retry 6 --retry-delay 20 --retry-all-errors \
            https://gestion.patesenfolie.cd/api/version
      - name: Déclencher l'envoi du rapport mensuel
        run: |
          curl -fsS --max-time 180 -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://gestion.patesenfolie.cd/api/cron/rapport-mensuel
