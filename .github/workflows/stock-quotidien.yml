name: Courriel quotidien du Stock

# Envoie chaque matin, SEULEMENT s'il y a quelque chose à signaler, le point du Stock (articles en rupture ou
# sous le seuil, factures échues ou à échéance sous 7 jours, DLC proches, demandes en attente, bons de commande
# à réceptionner, stocks négatifs) par e-mail à la Direction et au rôle Stock, en appelant l'endpoint sécurisé
# de l'application. Même jeton (CRON_SECRET) et même horaire que les rappels RH.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC = 07:00 à Kinshasa (UTC+1), tous les jours
  workflow_dispatch: {} # bouton « Run workflow » pour tester manuellement

jobs:
  stock-quotidien:
    runs-on: ubuntu-latest
    steps:
      # Réveil d'abord (2026-10-14) : l'instance Render gratuite s'endort après 15 min ; son démarrage à froid
      # mangeait le délai de l'envoi (curl : code 28). On attend qu'elle réponde, sans rien déclencher.
      - name: Réveiller l'application
        run: |
          curl -fsS --max-time 60 --retry 6 --retry-delay 20 --retry-all-errors \
            https://gestion.patesenfolie.cd/api/version
      - name: Déclencher le courriel quotidien du Stock
        run: |
          curl -fsS --max-time 180 -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://gestion.patesenfolie.cd/api/cron/stock-quotidien
