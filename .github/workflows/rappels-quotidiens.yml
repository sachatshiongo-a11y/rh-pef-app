name: Rappels RH quotidiens

# Envoie chaque matin les rappels d'échéances (congés à valider, contrats, jour de paie, CNSS)
# par e-mail aux comptes Direction, en appelant l'endpoint sécurisé de l'application.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC = 07:00 à Kinshasa (UTC+1), tous les jours
  workflow_dispatch: {} # bouton « Run workflow » pour tester manuellement

jobs:
  rappels:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher l'envoi des rappels
        run: |
          curl -fsS --max-time 120 -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://rh.patesenfolie.cd/api/cron/alertes
