name: Garder le serveur éveillé

# Empêche la mise en veille de Render (offre gratuite) qui cause un réveil à froid de ~50 s.
# Ping le site toutes les ~10 min pendant les heures de bureau (Kinshasa, UTC+1),
# pour qu'il ne reste jamais 15 min inactif. Gratuit.
#
# ⚠️ Les crons GitHub Actions peuvent être décalés de quelques minutes en période de charge.
# Pour une fiabilité maximale, un moniteur externe type UptimeRobot (gratuit, toutes les 5 min)
# est encore plus sûr — voir le README.

on:
  schedule:
    - cron: "*/10 5-19 * * *" # toutes les 10 min, ~06h–20h heure de Kinshasa
  workflow_dispatch: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Réveiller le serveur
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://rh.patesenfolie.cd/login || echo "000")
            echo "Ping $i → HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "Serveur non réveillé après 3 essais"
